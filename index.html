<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滄浪闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{max-width:640px; margin:0 auto; font-size:18px}
  header{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px}
  header h1{font-size:1.6rem; letter-spacing:.08em}
  .who{color:var(--muted); font-size:1rem; text-align:right}
  main{display:flex; flex-direction:column; gap:14px}
  .big{font-family:var(--display); font-weight:700; font-size:1.5rem; line-height:1.4}
  .center{text-align:center}
  .form{display:grid; grid-template-columns:minmax(0,1fr); gap:14px}
  .form label{display:grid; grid-template-columns:minmax(0,1fr); gap:6px; font-size:1.1rem}
  .form select,.form input{font-size:1.3rem; padding:.5em .7em; width:100%; min-width:0}
  .wide{width:100%; font-size:1.25rem; padding:.75em 1em; border-radius:12px}
  .err{color:var(--bad); font-weight:500}
  .timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:1.3rem}
  .timer.low{color:var(--bad)}
  .bar{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .tiers{display:grid; gap:12px}
  .tier{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; text-align:left; padding:16px; border-radius:14px; border-width:2px; min-height:84px; align-items:center}
  .tier .tname{font-family:var(--display); font-weight:700; font-size:1.4rem}
  .tier .tdesc{grid-column:2; color:var(--muted); font-size:1rem}
  .tier .tleft{grid-column:2; font-size:.95rem; color:var(--muted)}
  .tier.m{border-color:var(--river)} .tier.u{border-color:var(--shield)} .tier.a{border-color:var(--gold)}
  .qhead{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
  .src{color:var(--muted); font-size:.9rem}
  .stem{font-size:1.2rem; font-weight:500; line-height:1.6; overflow-wrap:anywhere}
  .quote{font-size:1.1rem}
  .opts{display:grid; gap:10px}
  .opt{display:flex; gap:12px; align-items:flex-start; text-align:left; padding:14px; border-radius:12px; border-width:2px; font-size:1.12rem; line-height:1.5; min-height:56px; overflow-wrap:anywhere}
  .opt .k{font-weight:700; color:var(--muted); min-width:1.3em}
  .opt.sel{border-color:var(--river); background:color-mix(in srgb, var(--river) 14%, var(--surface))}
  .opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface))}
  .opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--surface))}
  .opt[disabled]{opacity:1; cursor:default}
  .verdict{font-family:var(--display); font-weight:700; font-size:1.6rem}
  .verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.part{color:var(--gold)}
  .mini{display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center}
  .mini .scene{aspect-ratio:1}
  .score{font-family:var(--display); font-size:4rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
  .sticky{position:sticky; bottom:0; padding:10px 0; background:linear-gradient(transparent, var(--bg) 30%)}
</style>
</head>
<body>
<header>
  <h1>滄浪闖關</h1>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="card center">載入中……</div></main>
<script type="module" src="js/student.js"></script>
<script>
  // 舊手機或某些 App 內建瀏覽器跑不動程式時，至少告訴學生怎麼辦
  setTimeout(function () {
    var m = document.getElementById("main");
    if (m && /載入中/.test(m.textContent)) {
      m.innerHTML = '<div class="card center err">一直載入不出來嗎？<br>請點右上角選單，改用「Chrome」或「Safari」開啟這個網址；還是不行請找老師。</div>';
    }
  }, 12000);
</script>
</body>
</html>
