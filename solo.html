<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滄浪闖關・單人挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{max-width:760px; margin:0 auto; font-size:18px; padding-bottom:72px}
  header{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px}
  header h1{font-size:1.6rem; letter-spacing:.08em}
  main{display:flex; flex-direction:column; gap:14px}
  .big{font-family:var(--display); font-weight:700; font-size:1.5rem; line-height:1.4}
  .center{text-align:center}
  .wide{width:100%; font-size:1.25rem; padding:.75em 1em; border-radius:12px}
  .lessons{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px}
  .lesson{display:flex; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; min-width:0}
  .lesson input{width:1.2em; height:1.2em; flex:none}
  .lesson .best{display:block; font-size:.85rem; color:var(--good); font-weight:500}
  .levels{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
  .levels button{padding:.7em .4em; border-radius:12px; border-width:2px}
  .levels button.cur{border-color:var(--ink); background:var(--ink); color:var(--bg)}
  .levels small{display:block; font-size:.85rem; opacity:.8}
  /* 對戰列：左邊是你、右邊是電腦 */
  .duel{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
  .side{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px; display:grid; gap:6px; min-width:0}
  .side.cpu{opacity:.92}
  .side .who{font-family:var(--display); font-weight:700; font-size:1.05rem; display:flex; justify-content:space-between; gap:6px}
  .side .scene{aspect-ratio:4/3}
  .side .mrow{font-size:.95rem}
  .icons{font-size:.95rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap}
  .think{font-size:.85rem; color:var(--muted); min-height:1.3em}
  .feed{font-size:1rem; min-height:1.5em; text-align:center; font-weight:500}
  .feed.good{color:var(--good)} .feed.bad{color:var(--bad)} .feed.gold{color:var(--gold)}
  .tiers{display:grid; gap:10px}
  .tier{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; text-align:left; padding:14px; border-radius:14px; border-width:2px; align-items:center}
  .tier .tname{font-family:var(--display); font-weight:700; font-size:1.3rem}
  .tier .tdesc{grid-column:2; color:var(--muted); font-size:.95rem}
  .tier.m{border-color:var(--river)} .tier.u{border-color:var(--shield)} .tier.a{border-color:var(--gold)}
  .qhead{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
  .src{color:var(--muted); font-size:.9rem}
  .stem{font-size:1.2rem; font-weight:500; line-height:1.6; overflow-wrap:anywhere}
  .quote{font-size:1.1rem}
  .opts{display:grid; gap:10px}
  .opt{display:flex; gap:12px; align-items:flex-start; text-align:left; padding:14px; border-radius:12px; border-width:2px; font-size:1.12rem; line-height:1.5; min-height:56px; overflow-wrap:anywhere}
  .opt .k{font-weight:700; color:var(--muted); min-width:1.3em}
  .opt.sel{border-color:var(--river); background:color-mix(in srgb, var(--river) 14%, var(--surface))}
  .opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface))}
  .opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--surface))}
  .opt[disabled]{opacity:1; cursor:default}
  .verdict{font-family:var(--display); font-weight:700; font-size:1.5rem}
  .verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.part{color:var(--gold)}
  .bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .score{font-family:var(--display); font-size:4rem; font-weight:700; line-height:1}
  .review{display:grid; gap:12px}
  .review .card{display:grid; gap:8px}
  .sticky{position:sticky; bottom:0; padding:10px 0; background:linear-gradient(transparent, var(--bg) 30%)}
  .banner{position:fixed; left:50%; top:35%; transform:translate(-50%,-50%); z-index:30; font-family:var(--display); font-weight:700; font-size:clamp(2rem, 9vw, 3.6rem); color:var(--gold); text-shadow:0 2px 0 var(--surface), 0 0 24px var(--surface); pointer-events:none; animation:pop 1.6s forwards; white-space:nowrap}
  @keyframes pop{0%{opacity:0; transform:translate(-50%,-50%) scale(.6)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .banner{animation:none; opacity:0} }
</style>
</head>
<body>
<header>
  <h1>滄浪闖關</h1>
  <div class="muted">單人挑戰・和電腦比賽</div>
</header>
<main id="main"><div class="card center">載入中……</div></main>
<script type="module" src="js/solo.js"></script>
</body>
</html>
